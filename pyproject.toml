[project]
name = "onedata-mcp"
version = "0.1.0"
description = "Collection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.1.72",
    "fastmcp==3.2.4",
    "python-dotenv>=1.2.2",
]


[project.scripts]
onedata-mcp = "onedata_mcp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mcp[cli]>=1.27.0",
    "openai>=1.88.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-httpx>=0.35.0",
    "ruff>=0.11.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "UP045"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
reportUnusedFunction = "none"

[tool.pytest.ini_options]
# Single-process only: avoid pytest-xdist multi-worker runs even if installed globally / in tooling.
addopts = [ "-p", "no:xdist" ]
asyncio_mode = "strict"
asyncio_default_test_loop_scope = "function"
asyncio_default_fixture_loop_scope = "function"
testpaths = [ "test" ]
markers = [
    "e2e: End-to-end PLGrid Forge LLM + MCP tests (requires PLGRID_FORGE_* env; some need Onedata)",
    "onedata_integration: requires live Onezone / Oneprovider",
]
